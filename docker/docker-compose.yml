version: "3.8"
services:
  postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"

  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    depends_on:
      - postgres
    ports:
      - "8501:8501"
    volumes:
      - ../:/app
    command: streamlit run app.py --server.runOnSave true
